<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Alumbrado Inteligente</title>
  
  <!-- CSS EXTERNO -->
  <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>

  <div class="login-container">

    <!-- LOGO -->
    <div class="logo">
      <span class="logo-icon">🌆</span>
      <h1>ALUMBRADO INTELIGENTE</h1>
      <p>Sistema de Monitoreo en Tiempo Real</p>
    </div>

    <!-- MENSAJE DE ERROR -->
    <div class="error-message" id="errorMessage">
      ⚠️ Usuario o contraseña incorrectos
    </div>

    <!-- FORMULARIO -->
    <form id="loginForm">

      <div class="form-group">
        <label for="usuario">Usuario</label>
        <input 
          type="text" 
          id="usuario" 
          placeholder="Ingresa tu usuario"
          required
          autocomplete="username"
        >
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          placeholder="Ingresa tu contraseña"
          required
          autocomplete="current-password"
        >
      </div>

      <div class="form-options">
        <label>
          <input type="checkbox" id="recordar"> Recordarme
        </label>
        <a href="#">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="btn-login">
        INICIAR SESIÓN
      </button>

    </form>

    <!-- FOOTER -->
    <div class="footer">
      Proyecto Escolar - Ingeniería en Sistemas<br>
      <span>ESP32 · ESP-NOW · Elixir</span>
    </div>

  </div>

  <!-- JAVASCRIPT EXTERNO -->
  <script src="assets/js.js/login.js"></script>

</body>
</html>
